name: Grafana apply

# Applies ops/grafana/ to the Grafana Cloud stack on merge to develop: alert rules, contact
# point, notification policies, the "tonight" dashboard and the uptime checks. Deleting a rule
# from the repo deletes it in Grafana. Pull requests are checked by grafana-check.yml, without
# credentials. The credentials live in the protected `grafana` environment, which only develop
# can use (observability.md, "Config as code"; security-model.md §7).
on:
  push:
    branches:
      - develop
    paths:
      - "ops/grafana/**"
      - ".github/workflows/grafana.yml"
  # Re-apply, or fire the test alert: run with test_alert=staging or production, check the
  # email arrived, then run again with test_alert=none (observability.md, "Test alert").
  workflow_dispatch:
    inputs:
      test_alert:
        description: Unpause the test alert for one environment (none pauses both)
        type: choice
        options:
          - none
          - staging
          - production
        default: none

permissions:
  contents: read

# One apply at a time, and never cancel one half way.
concurrency:
  group: grafana-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform plan and apply
    runs-on: ubuntu-latest
    environment: grafana
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ops/grafana
    env:
      TF_IN_AUTOMATION: "true"
      # Terraform state: a private Supabase Storage bucket over its S3-compatible API.
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_ENDPOINT_URL_S3: ${{ vars.TF_STATE_ENDPOINT }}
      AWS_REGION: ${{ vars.TF_STATE_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_grafana_url: ${{ vars.GRAFANA_URL }}
      TF_VAR_grafana_auth: ${{ secrets.GRAFANA_TF_TOKEN }}
      TF_VAR_sm_url: ${{ vars.GRAFANA_SM_URL }}
      TF_VAR_sm_access_token: ${{ secrets.GRAFANA_SM_TOKEN }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_health_targets: ${{ vars.HEALTH_TARGETS }}
      TEST_ALERT: ${{ inputs.test_alert || 'none' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Check configuration
        run: |
          missing=""
          for name in TF_STATE_BUCKET AWS_ENDPOINT_URL_S3 AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_VAR_grafana_url \
            TF_VAR_grafana_auth TF_VAR_sm_url TF_VAR_sm_access_token TF_VAR_alert_email TF_VAR_health_targets; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            # AWS_* names are the TF_STATE_* values (TF_STATE_ENDPOINT, TF_STATE_REGION, TF_STATE_ACCESS_KEY_ID, …).
            echo "::error::Missing from the grafana environment:$missing (observability.md, \"Setting up a stack\")"
            exit 1
          fi
      - name: Test alert setting
        run: |
          case "$TEST_ALERT" in
            none) echo 'TF_VAR_test_alert_environments=[]' >> "$GITHUB_ENV" ;;
            staging|production) echo "TF_VAR_test_alert_environments=[\"$TEST_ALERT\"]" >> "$GITHUB_ENV" ;;
            *) echo "::error::test_alert must be none, staging or production"; exit 1 ;;
          esac
      - run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      # The plan is printed in the run log before it is applied. Sensitive values print as (sensitive).
      - run: terraform plan -input=false -out=grafana.tfplan
      - run: terraform apply -input=false grafana.tfplan
