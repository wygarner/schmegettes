# game on Fly.io. One file for staging and production: .github/workflows/deploy.yml passes
# --app (schmegettes-game-staging / schmegettes-game-prod) and --env APP_ENV=... Secrets
# (DATABASE_URL, SUPABASE_URL, SUPABASE_JWKS_URL, ALLOWED_ORIGINS) are set by hand with
# `fly secrets set`. See docs/system-docs/operations/deployment.md.
#
# Exactly one machine (`fly scale count 1`): rooms run on a single instance until room ownership
# exists (docs/system-docs/architecture/realtime-game-server.md). A rolling deploy of one machine
# replaces it in place and waits for /healthz, so two instances never split rooms. Never use
# bluegreen or canary here. A deploy costs players a reconnect; games resume from Postgres.

# Keep next to the Supabase project's region (us-east-1).
primary_region = "iad"
kill_signal = "SIGTERM"
# The game closes rooms and drains for up to 20 s on SIGTERM.
kill_timeout = "30s"

[env]
  PORT = "3002"
  LOG_LEVEL = "info"

[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 3002
  force_https = true
  # Stopping the only machine would close every room's sockets.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
