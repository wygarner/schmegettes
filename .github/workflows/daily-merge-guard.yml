name: Daily Merge Guard

# The daily/YYYY-MM-DD -> develop PR must merge as a merge commit, never a squash
# (docs/system-docs/engineering/branch-strategy.md, "Daily branch"). Nothing on the
# repository prevents a squash, so this run fails when one lands and says how to repair it.
#
# Known gap: GitHub starts no push workflow when the pushed commit's message contains
# "[skip ci]", and a squash merge copies that marker out of any commit it includes. A
# "[Daily]" commit on develop with no run of this workflow is also a squashed daily.
on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  daily-merge-guard:
    name: Daily Merge Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 2: the commit at the edge of a shallow clone reports no parents.
          fetch-depth: 2
          persist-credentials: false

      # The script uses only Node's standard library, so the runner's preinstalled Node is enough.
      - name: Fail on a squashed daily merge
        run: node scripts/daily-merge-guard.cjs "$GITHUB_SHA"
