openapi: 3.1.0
info:
  title: Schmegettes API
  version: 0.1.0
  description: |
    REST contract for api/ (Go). Live gameplay is not here; it is the WebSocket
    protocol in shared/schemas/protocol/. Every endpoint except /healthz and /version
    requires a Supabase access token (Bearer). Changing this file is a reviewed
    contract change; run `mise run gen` and commit the generated code.
servers:
  - url: http://localhost:3001
security:
  - supabaseJwt: []
paths:
  /healthz:
    get:
      security: []
      summary: Liveness and dependency check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /version:
    get:
      security: []
      summary: The commit this instance was built from (used by deploy verification)
      responses:
        "200":
          description: Build info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
  /v1/me:
    get:
      summary: The caller's profile (created on first call)
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    patch:
      summary: Update display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 40 }
              required: [displayName]
              additionalProperties: false
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /v1/rooms:
    post:
      summary: Create a room; the caller becomes host
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                seasons: { type: array, items: { type: integer } }
                maxPlayers: { type: integer, minimum: 2, maximum: 8, default: 6 }
              additionalProperties: false
      responses:
        "201":
          description: Room created. The board is built when the host starts the game.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
  /v1/rooms/join:
    post:
      summary: Join a room by code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { $ref: "./schemas/domain.schema.json#/$defs/RoomCode" }
                role: { type: string, enum: [contestant, spectator], default: contestant }
              required: [code]
              additionalProperties: false
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomJoin" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/rooms/{roomId}:
    get:
      summary: Room details (members only)
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      summary: Change room settings before the game starts (host only)
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seasons:
                  type: [array, "null"]
                  items: { type: integer, minimum: 1 }
                  description: Seasons to build boards from; null means every season
                maxPlayers: { type: integer, minimum: 2, maximum: 8 }
              additionalProperties: false
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/games:
    get:
      summary: The caller's ended games (finished or abandoned), newest first
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Page of games
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/GameSummary" } }
                  nextCursor: { type: [string, "null"] }
                required: [items, nextCursor]
  /v1/games/{gameId}:
    get:
      summary: A game's scoreboard (anyone who played or watched it)
      parameters:
        - { name: gameId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameDetail" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
      required: [status]
    Version:
      type: object
      properties:
        service: { type: string }
        commit: { type: string, description: Full git SHA the build was made from }
      required: [service, commit]
    Profile:
      type: object
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        isAnonymous: { type: boolean }
      required: [userId, displayName, isAnonymous]
    Room:
      type: object
      properties:
        roomId: { type: string, format: uuid }
        code: { $ref: "./schemas/domain.schema.json#/$defs/RoomCode" }
        status: { $ref: "./schemas/domain.schema.json#/$defs/RoomStatus" }
        hostUserId: { type: string, format: uuid }
        maxPlayers: { type: integer }
        seasons:
          type: [array, "null"]
          items: { type: integer }
          description: Seasons boards are built from; null means every season
      required: [roomId, code, status, hostUserId, maxPlayers, seasons]
    RoomJoin:
      type: object
      properties:
        room: { $ref: "#/components/schemas/Room" }
        gameSocketUrl: { type: string, format: uri, description: WebSocket URL for this room on game/ }
      required: [room, gameSocketUrl]
    GameSummary:
      type: object
      description: One of the caller's past games, from their point of view.
      properties:
        gameId: { type: string, format: uuid }
        status: { $ref: "./schemas/domain.schema.json#/$defs/GameStatus" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, description: When the game ended, finished or abandoned }
        score: { type: integer, description: The caller's score }
        placement:
          type: [integer, "null"]
          description: The caller's placement; ties share a place; null if they hosted (the TV) or watched
        players:
          type: array
          items: { type: string }
          description: Display names as they were in that game ("Former player" for deleted accounts)
        playerCount: { type: integer }
      required: [gameId, status, startedAt, finishedAt, score, placement, players, playerCount]
    GameDetail:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        status: { $ref: "./schemas/domain.schema.json#/$defs/GameStatus" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        results:
          type: array
          description: Contestants ordered by placement; the host (the TV) and spectators are not listed
          items: { $ref: "#/components/schemas/GameResult" }
      required: [gameId, status, startedAt, finishedAt, results]
    GameResult:
      type: object
      properties:
        displayName: { type: string, description: Name as it was in that game, or "Former player" }
        score: { type: integer }
        placement: { type: integer, description: Ties share a place }
      required: [displayName, score, placement]
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
      required: [title, status]
