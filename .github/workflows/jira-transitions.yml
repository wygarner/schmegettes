name: Jira State Transitions

on:
  pull_request:
    types: [opened, closed]

jobs:
  transition:
    runs-on: ubuntu-latest
    # The end-of-day daily/* -> develop PR re-carries every task PR already
    # transitioned when it merged into the daily branch, so it is skipped.
    if: >-
      !startsWith(github.head_ref, 'daily/') &&
      (github.event.action == 'opened' || github.event.pull_request.merged == true)
    permissions:
      pull-requests: read
      contents: read

    steps:
      # The base branch's scripts and jira.json, never the PR's own copy: this job holds the Jira secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Get PR file statuses
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A PR opened with merge conflicts returns no file list, so no transition fires.
          # Merge the base branch in before opening the PR.
          STATUS_FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[] | "\(.status) \(.filename)"' 2>/dev/null) || STATUS_FILES=""
          {
            echo "status_files<<EOF"
            echo "$STATUS_FILES"
            echo "EOF"
            echo "files<<EOF"
            echo "$STATUS_FILES" | awk '{print $2}'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Detect transition and Jira key
        id: detect
        env:
          STATUS_FILES: ${{ steps.files.outputs.status_files }}
          ACTION: ${{ github.event.action }}
        run: |
          P="$(jq -r .projectKey trusted/.github/jira.json)"
          # Only the first task-brief.md in the PR is processed: one ticket per spec PR.
          IN_PROGRESS=$(echo "$STATUS_FILES" | grep -E "^(added|renamed) tasks/[^/]+-${P}-[0-9]+/task-brief\.md" | head -1 || true)
          REMOVED=$(echo "$STATUS_FILES" | grep -E "^removed tasks/[^/]+-${P}-[0-9]+/task-brief\.md" | head -1 || true)

          transition=none
          line=""
          if [ -n "$IN_PROGRESS" ] && [ "$ACTION" = "closed" ]; then
            transition=inProgress; line="$IN_PROGRESS"
          elif [ -n "$REMOVED" ] && [ "$ACTION" = "opened" ]; then
            transition=inReview; line="$REMOVED"
          elif [ -n "$REMOVED" ] && [ "$ACTION" = "closed" ]; then
            transition=done; line="$REMOVED"
          fi
          KEY=$(echo "$line" | grep -oE "${P}-[0-9]+" | head -1 || true)
          echo "transition=$transition" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # The spec is read from the merged content, so check out the PR's merge commit as data.
      - name: Check out the merged task spec
        if: steps.detect.outputs.transition == 'inProgress' && steps.detect.outputs.key != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          path: merged
          sparse-checkout: tasks
          persist-credentials: false

      - name: Transition ticket
        if: steps.detect.outputs.transition != 'none' && steps.detect.outputs.key != ''
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          KEY: ${{ steps.detect.outputs.key }}
          STEP: ${{ steps.detect.outputs.transition }}
        run: python3 trusted/.github/scripts/transition-jira.py "$KEY" "$STEP"

      - name: Update Jira with the merged task spec
        if: steps.detect.outputs.transition == 'inProgress' && steps.detect.outputs.key != ''
        working-directory: merged
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CHANGED_FILES: ${{ steps.files.outputs.files }}
          JIRA_KEY: ${{ steps.detect.outputs.key }}
        run: python3 "$GITHUB_WORKSPACE/trusted/.github/scripts/update-jira-task-spec.py"
