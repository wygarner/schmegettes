# Toolchain versions for every package, used by local machines and CI (jdx/mise-action).
# After the first `mise install`, run `mise use --pin <tool>` to replace any prefix
# below with the exact patch version, and commit the change.
# Changing a version here is a stack change: update docs/system-docs/engineering/stack.md too.

[tools]
node = "24"          # web, devtools, shared codegen, repo scripts
bun = "1.3.14"       # package manager + workspace for the TypeScript packages
go = "1.25"          # game/, api/
python = "3.13"      # worker/, evals/, .github/scripts
uv = "0.13.5"        # Python package manager
"aqua:supabase/cli" = "2.122.0" # database migrations, local Supabase
flyctl = "0.4.123"   # api/ and game/ deploys and rollback (Fly.io)

# ---------------------------------------------------------------------------
# Tasks: `mise run <task>`. Test tasks take paths so you only run what you touched.
# ---------------------------------------------------------------------------

[tasks.setup]
description = "Install every package's dependencies and generate contract code"
run = [
  "bun install",
  "mise run gen",
  "cd game && go mod download",
  "cd api && go mod download",
  "cd worker && uv sync",
]

[tasks.gen]
description = "Regenerate code from shared/ contracts (TS, Go, Python)"
run = "bun run --cwd shared gen"

[tasks."db:start"]
description = "Start local Supabase (needs Docker)"
run = "supabase start"

[tasks."db:up"]
description = "Start local Supabase only if it isn't running (dev:api and dev:game depend on it)"
run = "supabase status >/dev/null 2>&1 || supabase start"

[tasks."db:reset"]
description = "Recreate the local database from supabase/migrations and seed.sql"
run = "supabase db reset"

[tasks."db:test"]
description = "Run pgTAP tests in supabase/tests (row-level security)"
run = "supabase test db"

[tasks.dev]
description = "Start local Supabase if needed, then run web, api, game, and worker in parallel (`bun run dev` calls this)"
depends = ["dev:web", "dev:api", "dev:game", "dev:worker"]

[tasks."dev:web"]
run = "bun run --cwd web dev"

[tasks."dev:devtools"]
run = "bun run --cwd devtools dev"

[tasks."dev:game"]
dir = "game"
depends = ["db:up"]
# Go doesn't read env files, so load game/.env (copied from .env.example) first.
run = "test -f .env || { echo 'game/.env missing: cp game/.env.example game/.env' >&2; exit 1; }; set -a; . ./.env; set +a; go run ./cmd/game"

[tasks."dev:api"]
dir = "api"
depends = ["db:up"]
# Go doesn't read env files, so load api/.env (copied from .env.example) first.
run = "test -f .env || { echo 'api/.env missing: cp api/.env.example api/.env' >&2; exit 1; }; set -a; . ./.env; set +a; go run ./cmd/api"

[tasks."dev:worker"]
dir = "worker"
run = "uv run python -m schmegettes_worker"

[tasks."clues:import"]
description = "Load clue dataset seasons into the local catalog. Usage: mise run clues:import -- --seasons 1-5"
dir = "worker"
# Reads DATABASE_OWNER_URL and CLUE_DATASET_BASE_URL from worker/.env (copied from .env.example).
run = "test -f .env || { echo 'worker/.env missing: cp worker/.env.example worker/.env' >&2; exit 1; }; set -a; . ./.env; set +a; uv run python -m schmegettes_worker import-clues"

[tasks."test:web"]
description = "Usage: mise run test:web -- src/path/to/file.test.tsx"
run = "bun run --cwd web test"

[tasks."test:devtools"]
description = "Usage: mise run test:devtools -- src/path/to/file.test.tsx"
run = "bun run --cwd devtools test"

[tasks."test:game"]
description = "Usage: mise run test:game -- ./internal/room/..."
dir = "game"
run = "go test -race"

[tasks."test:api"]
description = "Usage: mise run test:api -- ./internal/rooms/..."
dir = "api"
run = "go test -race"

[tasks."test:worker"]
description = "Usage: mise run test:worker -- tests/test_judging.py"
dir = "worker"
run = "uv run pytest"

[tasks."test:scripts"]
run = [
  "node --test scripts/*.test.cjs",
  "cd .github/scripts && python3 -m unittest discover -s tests -t .",
]
