name: CI

on:
  pull_request:
    # Every task PR targets develop and merges only with this green. There is no push trigger:
    # commits pushed straight to develop need a manual dispatch before a release includes them.
    branches:
      - develop
      - production
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.detect.outputs.shared }}
      web: ${{ steps.detect.outputs.web }}
      devtools: ${{ steps.detect.outputs.devtools }}
      game: ${{ steps.detect.outputs.game }}
      api: ${{ steps.detect.outputs.api }}
      worker: ${{ steps.detect.outputs.worker }}
      database: ${{ steps.detect.outputs.database }}
      scripts: ${{ steps.detect.outputs.scripts }}
      evals: ${{ steps.detect.outputs.evals }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      worker_ready: ${{ steps.ready.outputs.worker_ready }}
      evals_ready: ${{ steps.ready.outputs.evals_ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Python packages are skipped until their lockfile or project file exists (evals/ has none yet).
      - name: Detect generated packages
        id: ready
        run: |
          echo "worker_ready=$([ -f worker/uv.lock ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "evals_ready=$([ -f evals/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Detect package changes
        id: detect
        run: |
          OUTPUTS="shared web devtools game api worker database scripts evals"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for o in $OUTPUTS; do echo "$o=true" >> "$GITHUB_OUTPUT"; done
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          has() { grep -qE "$1" <<<"$FILES" && echo true || echo false; }
          # A shared/ or toolchain change fans out to every consumer.
          CORE='^(shared/|mise\.toml$)'
          {
            echo "shared=$(has "$CORE")"
            echo "web=$(has "$CORE|^web/|^e2e/|^package\.json$|^bun\.lock$|^biome\.json$")"
            echo "devtools=$(has "$CORE|^devtools/|^package\.json$|^bun\.lock$")"
            echo "game=$(has "$CORE|^game/|^golib/")"
            echo "api=$(has "$CORE|^api/|^golib/|^supabase/")"
            echo "worker=$(has "$CORE|^worker/|^supabase/")"
            echo "database=$(has "$CORE|^supabase/")"
            echo "scripts=$(has '^scripts/|^\.github/')"
            echo "evals=$(has '^evals/|^worker/prompts/')"
            # PRs that only touch docs, tasks, or releases skip every check. Keep in step with
            # deploy-staging.yml's paths-ignore, which skips the staging deploy for the same pushes.
            echo "docs_only=$(grep -qvE '^(docs/|tasks/|releases/|.*\.md$)' <<<"$FILES" && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"

  secret-scan:
    name: Secret Scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks binary
        run: |
          gitleaks_version="8.30.1"
          gitleaks_archive="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/${gitleaks_archive}" \
            --output "${RUNNER_TEMP}/${gitleaks_archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${RUNNER_TEMP}/${gitleaks_archive}" \
            | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${gitleaks_archive}" -C "${RUNNER_TEMP}" gitleaks
      - name: Scan pull request commits
        run: |
          "${RUNNER_TEMP}/gitleaks" git . \
            --config .gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact --no-banner

  scripts:
    name: Repo Scripts
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node python
      - run: mise run test:scripts

  shared:
    name: Shared Contracts
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node bun go uv python
      - run: bun install --frozen-lockfile
      - name: Schema tests
        run: bun run --cwd shared test
      - name: Generated code is up to date
        run: |
          mise run gen
          if ! git diff --exit-code; then
            echo "::error::Generated contract code is stale. Run 'mise run gen' and commit the result."
            exit 1
          fi

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node bun
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - name: Build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_API_URL: http://localhost:3001
          VITE_ENV: production
          GIT_SHA: ${{ github.sha }}
        run: bun run --cwd web build
      # E2E mode (web/src/lib/e2e.ts) must be compiled out of production builds.
      - name: No E2E mode in a production build
        run: |
          if grep -rlE '__e2e|schmegettes\.e2e' web/dist; then
            echo "::error::E2E mode is in the production bundle (files above)"
            exit 1
          fi
      - run: bun run --cwd web test:coverage

  devtools:
    name: Devtools
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.devtools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node bun
      - run: bun install --frozen-lockfile
      - run: bunx biome ci devtools
      - run: bun run --cwd devtools build
      - run: bun run --cwd devtools test:coverage

  game:
    name: Game Server
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go node
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::Run gofmt -w ."; exit 1; }
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage floors
        run: node ../scripts/coverage-floor.cjs coverage.out
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # golib/ is shared with api/ and has no job of its own; it is checked here.
      - name: golib
        working-directory: golib
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::Run gofmt -w ."; exit 1; }
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
          go test -race -coverprofile=coverage.out ./...
          node ../scripts/coverage-floor.cjs coverage.out

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go node
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::Run gofmt -w ."; exit 1; }
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage floors
        run: node ../scripts/coverage-floor.cjs coverage.out
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  worker:
    name: Worker
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.worker == 'true' && needs.changes.outputs.worker_ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: python uv
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # Floor: docs/system-docs/engineering/testing-strategy.md §3.
      - run: uv run pytest --cov=schmegettes_worker --cov-report=term --cov-fail-under=43
      - run: uvx pip-audit --strict

  database:
    name: Database (migrations + RLS)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: aqua:supabase/cli
      # config.toml points at this git-ignored file. CI gets a throwaway key; --yes skips the
      # overwrite prompt that would otherwise block a non-interactive run.
      - name: Generate a throwaway JWT signing key
        run: |
          echo '[]' > supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --yes > /dev/null
      - name: Apply every migration and the seed to a fresh database
        run: supabase db start
      - run: supabase db lint --level warning --fail-on error
      - name: Row-level security tests
        run: supabase test db

  # Starts what deploys run: the api and game images built from their Dockerfiles, and the
  # production web build. A build that crashes at boot fails here, not on deploy.
  # docs/system-docs/engineering/testing-strategy.md ("Test the build").
  boot:
    name: Boot (built services)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.game == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node bun aqua:supabase/cli
      - name: Generate a throwaway JWT signing key
        run: |
          echo '[]' > supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --yes > /dev/null
      # Postgres for the services, Auth for the JWKS they fetch at boot; nothing else.
      - name: Start local Supabase
        run: supabase start -x studio,mailpit,logflare,vector,imgproxy,storage-api,realtime,edge-runtime,supavisor,postgres-meta
      - name: Build the api and game images
        run: |
          docker build -f api/Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t boot-api .
          docker build -f game/Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t boot-game .
      - name: Start them and wait for /healthz
        run: |
          # app_service's password is the local-only one from supabase/seed.sql.
          common=(
            -e LOG_LEVEL=info
            -e DATABASE_URL=postgresql://app_service:app-service-local-only@127.0.0.1:54322/postgres
            -e SUPABASE_URL=http://127.0.0.1:54321
            -e SUPABASE_JWKS_URL=http://127.0.0.1:54321/auth/v1/.well-known/jwks.json
            -e ALLOWED_ORIGINS=http://localhost:4173
          )
          docker run -d --name api --network host "${common[@]}" -e PORT=3001 -e GAME_SOCKET_BASE_URL=ws://localhost:3002 boot-api
          docker run -d --name game --network host "${common[@]}" -e PORT=3002 boot-game
          for svc in api:3001 game:3002; do
            name="${svc%%:*}"; port="${svc##*:}"; ok=""
            for _ in $(seq 30); do
              if curl -fsS "http://127.0.0.1:$port/healthz" > /dev/null 2>&1; then ok=1; break; fi
              sleep 1
            done
            if [ -z "$ok" ]; then
              echo "::error::$name did not answer /healthz within 30 s. Its last 50 log lines:"
              docker logs --tail 50 "$name"
              exit 1
            fi
            echo "$name answers /healthz"
          done
      - run: bun install --frozen-lockfile
      - name: Build web for production
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_API_URL: http://localhost:3001
          VITE_ENV: production
          GIT_SHA: ${{ github.sha }}
        run: |
          VITE_SUPABASE_ANON_KEY="$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')"
          export VITE_SUPABASE_ANON_KEY
          bun run --cwd web build
      - name: Serve it and load Home
        run: |
          bun run --cwd web preview --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for _ in $(seq 30); do curl -fsS http://localhost:4173/ > /dev/null 2>&1 && break; sleep 1; done
          bun run --cwd e2e typecheck
          bun run --cwd e2e install-browser
          BOOT_BASE_URL=http://localhost:4173 bun run --cwd e2e test:boot
      - name: Service logs
        if: failure()
        run: |
          docker logs --tail 50 api || true
          docker logs --tail 50 game || true
          cat "$RUNNER_TEMP/preview.log" || true

  evals:
    name: Agent Evals (non-blocking)
    needs: changes
    # Needs ANTHROPIC_API_KEY, which a fork PR never receives.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.evals == 'true' && needs.changes.outputs.evals_ready == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: python uv
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cd evals && uv run python -m evals

  audit:
    name: JS Dependency Audit
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && (needs.changes.outputs.web == 'true' || needs.changes.outputs.devtools == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: bun
      - run: bun install --frozen-lockfile
      # Accepted (2026-11-18, release 0.1.0 internal notes): GHSA-fc5q-39xc-vjpf, ReDoS in picomatch <= 4.0.7.
      # No fixed release exists; it reaches only build tools (vite, vitest, json-schema-to-typescript).
      # Drop the --ignore once picomatch ships a fix.
      - run: bun audit --audit-level=high --ignore=GHSA-fc5q-39xc-vjpf

  # One required check for branch protection: fails if any job above failed.
  ci-complete:
    name: CI Complete
    if: always()
    needs: [changes, secret-scan, scripts, shared, web, devtools, game, api, worker, database, boot, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          results='${{ toJSON(needs) }}'
          if jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' <<<"$results" >/dev/null; then
            jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$results"
            exit 1
          fi
          echo "All required jobs passed or were skipped."
