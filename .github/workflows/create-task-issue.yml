name: Create Task Issue

on:
  pull_request:
    types: [opened]
    # Task-spec PRs target develop.
    branches: [develop]
    paths:
      - 'tasks/**/task-brief.md'
  workflow_dispatch:
    inputs:
      files:
        description: 'Newline-separated list of task-brief.md paths to process'
        required: true
        type: string

jobs:
  # Holds a token that can write issues. Its scripts come from the PR's base
  # branch, so a PR that edits .github/ does not get its own version run with
  # that token. The PR head is checked out only as data.
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      tickets: ${{ steps.create.outputs.tickets }}

    steps:
      - name: Check out the scripts from the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual run has no base branch; it uses the ref it was started on.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check out the task briefs from the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
          sparse-checkout: tasks
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Get task-brief files
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_FILES: ${{ inputs.files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES="$INPUT_FILES"
          else
            FILES=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --jq '.[].filename' 2>/dev/null | grep -E '^tasks/.+/task-brief\.md$' || true)
          fi
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create task issue
        id: create
        if: steps.changed.outputs.files != ''
        # The working directory is the pull request's content; the script is not.
        working-directory: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          SPEC_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 "$GITHUB_WORKSPACE/trusted/.github/scripts/create-task-issue.py"

  # Holds the write token and no issue rights. It runs no code from the
  # repository: it writes .task-meta.yml and renames the task folder from the
  # values above.
  commit-key:
    needs: create-issue
    if: needs.create-issue.outputs.tickets != '' && needs.create-issue.outputs.tickets != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit assigned key
        env:
          TICKETS: ${{ needs.create-issue.outputs.tickets }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.ref_name }}
        run: |
          keys=()
          while IFS= read -r ticket; do
            dir="$(jq -r '.dir' <<<"$ticket")"
            key="$(jq -r '.key' <<<"$ticket")"
            # Both values go into a path and a commit, so check them first.
            if [[ ! "$dir" =~ ^[a-z0-9-]+$ ]] || [[ ! "$key" =~ ^GH-[0-9]+$ ]]; then
              echo "::error::Unexpected task folder name or key; nothing committed"
              exit 1
            fi
            meta="tasks/$dir/.task-meta.yml"
            if [ ! -d "tasks/$dir" ] || [ -L "tasks/$dir" ] || [ -e "$meta" ] || [ -L "$meta" ] || [ -e "tasks/$dir-$key" ]; then
              echo "::error::tasks/$dir is not a task folder waiting for a key; nothing committed"
              exit 1
            fi
            jq -j '.meta' <<<"$ticket" > "$meta"
            git mv "tasks/$dir" "tasks/$dir-$key"
            keys+=("$key")
          done < <(jq -c '.[]' <<<"$TICKETS")

          git add -A tasks
          if [ -z "$(git status --porcelain)" ]; then
            echo "No task metadata changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # No "[skip ci]" marker. A push made with GITHUB_TOKEN starts no workflow
          # anyway, and the marker would be copied into every squash commit that
          # includes this one, which can make GitHub skip deploy-prod.yml.
          git commit -m "chore: assign task issue ${keys[*]}"

          if [ "$EVENT" = "workflow_dispatch" ] && { [ "$BASE" = "develop" ] || [ "$BASE" = "production" ]; }; then
            # A manual run on develop (a spec that merged without an issue) must
            # not push to it. This repository doesn't let Actions open pull requests, so
            # push a branch and link the PR to open.
            branch="chore/assign-${keys[0]}"
            git push origin "HEAD:refs/heads/$branch"
            url="${{ github.server_url }}/${{ github.repository }}/compare/$BASE...$branch?expand=1"
            echo "::notice::Open a PR for the rename: $url"
            echo "Open a PR for the rename: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            git push
          fi
