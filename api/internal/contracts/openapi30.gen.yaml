components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many tries (problem type `rate-limited`). Try again after
        `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
      required:
        - status
    Version:
      type: object
      properties:
        service:
          type: string
        commit:
          type: string
          description: Full git SHA the build was made from
      required:
        - service
        - commit
    Profile:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        isAnonymous:
          type: boolean
        accountName:
          type: string
          description: The signed-in player's name (leaderboard, name prefill); null for
            guests and new accounts
          nullable: true
      required:
        - userId
        - displayName
        - isAnonymous
        - accountName
    Room:
      type: object
      properties:
        roomId:
          type: string
          format: uuid
        code:
          description: Short code players type to join a room.
          type: string
          pattern: ^[A-Z0-9]{5}$
        status:
          type: string
          enum:
            - open
            - in_game
            - closed
        hostUserId:
          type: string
          format: uuid
        hostDisplayName:
          type: string
        hostPlays:
          type: boolean
          description: The host joined the game as a contestant on the host device
        maxPlayers:
          type: integer
        seasons:
          type: array
          items:
            type: integer
          description: Seasons boards are built from; null means every season
          nullable: true
      required:
        - roomId
        - code
        - status
        - hostUserId
        - hostDisplayName
        - hostPlays
        - maxPlayers
        - seasons
    DisplayName:
      type: string
      minLength: 1
      maxLength: 20
      description: Trimmed by the server; must not be blank
    RoomJoin:
      type: object
      properties:
        room:
          $ref: "#/components/schemas/Room"
        gameSocketUrl:
          type: string
          format: uri
          description: WebSocket URL for this room on game/
      required:
        - room
        - gameSocketUrl
    GameSummary:
      type: object
      description: One of the caller's past games, from their point of view.
      properties:
        gameId:
          type: string
          format: uuid
        status:
          description: "A recorded game: in_progress until it ends as finished (Final
            revealed) or abandoned (room closed or everyone left)."
          type: string
          enum:
            - in_progress
            - finished
            - abandoned
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          description: When the game ended
          finished or abandoned: null
        score:
          type: integer
          description: The caller's score
        placement:
          type: integer
          description: The caller's placement; ties share a place; null if they hosted
            (the TV) or watched
          nullable: true
        players:
          type: array
          items:
            type: string
          description: Display names as they were in that game ("Former player" for
            deleted accounts)
        playerCount:
          type: integer
        callerDisplayName:
          type: string
          description: The caller's name in that game, so a list can say "You"; null if
            they only watched
          nullable: true
        watched:
          type: boolean
          description: The caller hosted without playing
          or was a spectator: null
      required:
        - gameId
        - status
        - startedAt
        - finishedAt
        - score
        - placement
        - players
        - playerCount
    GameDetail:
      type: object
      properties:
        gameId:
          type: string
          format: uuid
        status:
          description: "A recorded game: in_progress until it ends as finished (Final
            revealed) or abandoned (room closed or everyone left)."
          type: string
          enum:
            - in_progress
            - finished
            - abandoned
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        results:
          type: array
          description: Contestants ordered by placement; the host (the TV) and spectators
            are not listed
          items:
            $ref: "#/components/schemas/GameResult"
        hostDisplayName:
          type: string
          description: The host's name in that game; null when the host's account was
            deleted
          nullable: true
        watched:
          type: boolean
          description: The caller hosted without playing
          or was a spectator: null
      required:
        - gameId
        - status
        - startedAt
        - finishedAt
        - results
    GameResult:
      type: object
      properties:
        displayName:
          type: string
          description: Name as it was in that game
          or "Former player": null
        score:
          type: integer
        placement:
          type: integer
          description: Ties share a place
        isCaller:
          type: boolean
          description: This row is the caller
      required:
        - displayName
        - score
        - placement
    HostAccess:
      type: object
      properties:
        canHost:
          type: boolean
      required:
        - canHost
      additionalProperties: false
    AdminHostCode:
      type: object
      properties:
        code:
          type: string
          pattern: ^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{8}$
        currentStartedAt:
          type: string
          format: date-time
        rotatesAt:
          type: string
          format: date-time
        previousValidUntil:
          type: string
          format: date-time
          nullable: true
        serverTime:
          type: string
          format: date-time
      required:
        - code
        - currentStartedAt
        - rotatesAt
        - previousValidUntil
        - serverTime
      additionalProperties: false
    AdminHost:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - account
            - guest
        email:
          type: string
          format: email
          nullable: true
        lastPlayedAs:
          type: string
          nullable: true
        hostSince:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 200
          nullable: true
      required:
        - userId
        - kind
        - email
        - lastPlayedAs
        - hostSince
        - note
      additionalProperties: false
    MergeTicket:
      type: object
      properties:
        ticket:
          type: string
          description: Secret; keep it only until it's redeemed
        expiresAt:
          type: string
          format: date-time
      required:
        - ticket
        - expiresAt
      additionalProperties: false
    MergeResult:
      type: object
      properties:
        gamesAdded:
          type: integer
          minimum: 0
          description: Finished and abandoned games moved into the account
        hostAccessAdded:
          type: boolean
          description: The account can host now and couldn't before
        accountWasNew:
          type: boolean
          description: The account had no name yet (first sign-in)
      required:
        - gamesAdded
        - hostAccessAdded
        - accountWasNew
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
      required:
        - title
        - status
