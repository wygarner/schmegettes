name: Grafana config check

# Checks ops/grafana/ (alerting, dashboards, uptime checks as Terraform) on pull requests:
# formatting and validation only, with no credentials and no environment, so it is safe for
# fork PRs. A plan needs a Grafana token, so plans run only in grafana.yml's apply job, after
# merge (observability.md, "Config as code").
on:
  pull_request:
    paths:
      - "ops/grafana/**"
      - ".github/workflows/grafana*.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ops/grafana
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
