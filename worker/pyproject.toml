[project]
name = "schmegettes-worker"
version = "0.1.0"
description = "Background jobs: clue imports, board building, LLM appeal judging"
requires-python = ">=3.13"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "structlog>=25.4",
]

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schmegettes_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["src/schmegettes_worker/contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "LOG"]
ignore = ["S101"] # asserts are fine in tests

[tool.mypy]
strict = true
exclude = ["src/schmegettes_worker/contracts"]
