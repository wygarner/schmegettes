name: Deploy Production

# A merge to production deploys it: migrate, deploy api/game (Fly.io) and web (Vercel), verify.
# The jobs live in deploy.yml; docs/system-docs/operations/deployment.md has the contract.
on:
  push:
    branches:
      - production
  # Manual re-run for a push that started no run (a "[skip ci]" marker copied into a merge
  # commit makes GitHub start no push workflow). Start it on the production branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Production
    if: github.ref == 'refs/heads/production'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
