name: Deploy

# One deploy for both environments, called by deploy-staging.yml (push to develop) and
# deploy-prod.yml (push to production). It is a thin caller of scripts/deploy.mjs, the only
# deploy implementation: an operator runs the same command when Actions is unavailable
# (docs/system-docs/operations/deployment.md). Keep migration, Fly, Vercel and version-check
# logic out of this file; scripts/deploy.test.mjs fails if any comes back.
#
# The command, in order: checks the commit (clean, from develop for staging, the production tip
# for production) and every setting; applies migrations; deploys api and game (Fly.io) and web
# (Vercel), each built with this commit's SHA; then fails unless every component's version
# endpoint reports that SHA. Rollback: release-strategy.md, "Rollback".
on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    steps:
      # Full history and every branch, so the command can check the commit is on develop or is
      # the production tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node bun flyctl aqua:supabase/cli
      # The GitHub Environment's values, under the names the command reads (deploy.mjs --help).
      # Each environment holds only its own owner URL: there is no fallback between them.
      - name: Deploy
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          STAGING_SUPABASE_DB_OWNER_URL: ${{ secrets.STAGING_SUPABASE_DB_OWNER_URL }}
          PROD_SUPABASE_DB_OWNER_URL: ${{ secrets.PROD_SUPABASE_DB_OWNER_URL }}
          FLY_APP_API: ${{ vars.FLY_APP_API }}
          FLY_API_TOKEN_API: ${{ secrets.FLY_API_TOKEN_API }}
          FLY_APP_GAME: ${{ vars.FLY_APP_GAME }}
          FLY_API_TOKEN_GAME: ${{ secrets.FLY_API_TOKEN_GAME }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_STATUS_URL: ${{ vars.VITE_STATUS_URL }}
          GAME_SOCKET_ORIGIN: ${{ vars.GAME_SOCKET_ORIGIN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          WEB_VERSION_URL: ${{ vars.WEB_VERSION_URL }}
          API_VERSION_URL: ${{ vars.API_VERSION_URL }}
          GAME_VERSION_URL: ${{ vars.GAME_VERSION_URL }}
        run: node scripts/deploy.mjs run "$ENVIRONMENT" all
